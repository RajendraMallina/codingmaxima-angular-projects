<header class="cm-project-header">
  <a class="cm-skip-link" href="#project-content">Skip to project</a>
  <a class="cm-project-brand" href="https://codingmaxima.com/" aria-label="CodingMaxima website"><span class="cm-logo" role="img" aria-label="CodingMaxima"></span></a>
  <span class="cm-project-divider" aria-hidden="true"></span>
  <div class="cm-project-meta"><span>INDEPENDENT PRACTICE PROJECT</span><strong>Digital Clock</strong></div>
</header>
<main id="project-content" class="clock-panel" aria-labelledby="clock-title">
  <p class="clock-kicker"><span></span> YOUR LOCAL TIME</p>
  <h1 id="clock-title">Digital Clock</h1>
  <p class="subtitle">A little clarity, right on time.</p>

  <time class="clock-display" [attr.datetime]="isoTime()" aria-live="off">{{ time() }}</time>
  <p class="date">{{ date() }}</p>

  <fieldset>
    <legend>Time format</legend>
    <label><input type="radio" name="clock-format" value="12" [checked]="format() === '12'"
      (change)="selectFormat($event)" /> 12-hour</label>
    <label><input type="radio" name="clock-format" value="24" [checked]="format() === '24'"
      (change)="selectFormat($event)" /> 24-hour</label>
  </fieldset>
  <p class="note"><span aria-hidden="true">◉</span> Syncing with your device's local time</p>
</main>
<footer class="cm-project-footer"><span><strong>CodingMaxima</strong> · Learn visually. Think logically. Code confidently.</span><span class="cm-footer-label">INDEPENDENT PROJECT</span></footer>
